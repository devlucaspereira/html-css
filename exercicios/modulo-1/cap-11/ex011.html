<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width:750px )" srcset="../Imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="../Imagens/foto-m.png" type="image/png">
        <img src="../Imagens/foto-g.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML5</p>
    <audio preload="metadata" autoplay controls loop> <!-- Auto: Só carrega o site depois de carregar o audio.  Metadata: Carrega algumas informações do audio.  none: Só carrega o audio quando o usuario clica nele. -->
        <source src="midia/classica.mp3" type="audio/mpeg">
        <source src="midia/classica.ogg" type="audio/ogg">
        <source src="midia/classica.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio <a href="midia/classica.mp3">Clique aqui para baixar o arquivo MP3</a></p>
    </audio>
</body>
</html>
